# E8-200: crewed lift + cruise eVTOL, 200 kg total payload
# Derived from the first E8 iteration (github.com/Rpirayesh/E8-eVTOL-Design-Explorer: two-person, eight-rotor,
# winged concept) and the E8-S subscale demonstrator (github.com/Rpirayesh/E8-eVTOL-Build).

payload:
  total_kg: 200                 # crew + cargo, the design payload
  design_case: "1 pilot (100 kg incl. clothing/headset) + 100 kg cargo, or 2 occupants of 100 kg"
  cabin: "2 side-by-side or tandem seats; the second seat folds/removes for cargo (min 0.6 x 0.5 x 0.5 m bay)"

mission:                         # optimiser target; sensitivity to 30 / 60 / 100 km must also be reported
  design_range_km: 20            # still air, wing-borne cruise. History: 100 km (does not close with current cells,
                                 # methods/initial_estimate.md) -> 50 km (iteration 1) -> 20 km from iteration 2, when the
                                 # CAD/FEA-calibrated masses and the 1.2 g one-motor-out flare were applied; below ~23 km the
                                 # battery is sized by hover power, so the range costs almost nothing extra
  cruise_speed_kmh_min: 120       # iteration 3.2 relaxation; was 135 (iteration 3.1), 150 in iterations 1-3. Must keep >= 1.15 x stall
  hover_takeoff_s: 60            # incl. vertical climb to 30 m
  transition_each_s: 30          # both transitions
  hover_landing_s: 60
  reserve: "20 % battery energy remaining at landing, plus 0.3 C margin; cells at end-of-life capacity (80 %)"
  altitude_m: 500                # ISA + 15 C hot day for hover power
  hover_ceiling_m: 1000          # out of ground effect, ISA + 15 C

configuration_baseline: "lift + cruise: fixed lift rotors on two booms, high wing, rear pusher, H/V tail between booms"
optimisation_variables:
  - number of lift rotors (4, 6, 8, coaxial pairs allowed)
  - lift rotor diameter, blade count
  - wing span, area, aspect ratio, airfoil
  - pusher diameter and motor
  - battery energy, cell type, series/parallel layout
  - cruise speed
objective: "minimum acquisition cost and build complexity (part count, distinct part types, tooling) that meets the mission; report MTOW, energy, cost"

safety:
  ultimate_factor: 1.5
  limit_load_factors: {positive: 3.8, negative: -1.5, landing_vertical_g: 3.0}   # CS-23 / ASTM F3264-style normal category
  one_lift_motor_out: "continued safe hover and controlled landing at MTOW with the remaining rotors <= 100 % of peak power"
  flight_controller_rotor_rpm_cap: "lift-rotor rpm limited by the flight controller to tip Mach 0.70 (2,460 rpm on the 1.85 m
                                    rotors, about 2,900 N per rotor); added in iteration 3.3"
  power: "at least 2 independent battery packs and buses; a single pack failure must still allow a controlled landing"
  recovery: "whole-aircraft ballistic parachute sized for MTOW"
  occupant: "energy-absorbing seats, 4-point harness, rotor plane clear of the cabin (no blade in the occupant plane)"
  regulations_to_reference: [FAA 14 CFR Part 103 (and why it does not apply), FAA powered-lift SFAR / AC 21.17-4, EASA SC-VTOL-01, ASTM F3264, CS-23 Amdt 5]

manufacturing:
  in_house: ["3-axis CNC (aluminium, plywood, MDF, tooling foam, wax)", "FDM printers (PLA/PETG/ABS/ASA/PA-CF, no metal)"]
  allowed_simple_processes: ["wet lay-up and vacuum bagging over CNC-cut foam/MDF plugs and moulds", "foam-core composite (hot-wire or CNC)",
                             "COTS pultruded / roll-wrapped carbon tube", "aluminium sheet and extrusions, rivets, bonding",
                             "outsourced laser/waterjet-cut flat parts", "outsourced 4130 welded tube if justified"]
  avoid: ["autoclave prepreg", "metal printing", "5-axis machining", "custom castings"]
  prefer: ["COTS propulsion and avionics", "one motor type for all lift rotors (and pusher if feasible)",
           "few distinct parts, symmetry, flat-pattern parts"]

constraints:
  footprint_max_m: 10.5          # iteration 3.2 relaxation; was 9.0. Span and length, road-trailer transport with the wing removed

iteration_3_2_relaxation:        # owner decision for the final 3.2 optimisation: relax the non-regulatory margins only
  relaxed:
    rotor_out_flare_g: 1.10      # was 1.20. Keeps a reserve above the 1.0 g continued-hover rule; floor 1.05 if 1.10 does not close
    cruise_over_stall: 1.15      # was 1.30 (hot day, flaps down). Stall is backed up by the lift rotors (powered-lift recovery)
    footprint_max_m: 10.5        # was 9.0. Transport with the wing removed; <= 9.0 preferred if it costs under about USD 5k
    cruise_speed_kmh_min: 120    # was 135. Allowed if cheaper, provided cruise >= 1.15 Vs
  kept:                          # the reliability core, unchanged
    - ultimate factor 1.5 and all load cases
    - one-motor-out continued hover with 10 % control margin, OEI torque and rpm
    - cell current <= 60 A and bus >= 400 V at end of life in every case incl. one pack out (add cells or packs, do not relax)
    - pusher continuous margin 10 % and climb >= 1 m/s
    - hover ceiling 1000 m ISA+15
    - 20 % reserve at 80 % end of life
    - 20 km range and 200 kg payload
    - parachute rating, tip Mach, door width, blade chord and all other constraints
